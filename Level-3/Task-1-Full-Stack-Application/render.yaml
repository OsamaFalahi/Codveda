services:
  - type: web
    name: codveda-full-stack-app
    runtime: docker
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: codveda-db
          property: connectionString
    buildCommand: npm run install:all && npm run build
    startCommand: npm start
    healthCheckPath: /api/health

databases:
  - name: codveda-db
    type: postgresql